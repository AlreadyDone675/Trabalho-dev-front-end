<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTech | Acompanhamento de Atendimentos</title>

    <!-- ÍCONE DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href="../img/atendimento.png">

    <!-- FOLHA DE ESTILOS CSS -->
    <link rel="stylesheet" href="../css/status-atendimento.css">

    <!-- ÍCONES BOOTSTRAP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>

    <!-- ESTRUTURA GERAL DA PÁGINA -->
    <div class="layout">

    <!-- CABEÇALHO SUPERIOR -->
    <header>
        <div class="logo">
            <h2>ServiceTech</h2>
            <img src="../img/logo.jpg" alt="Logo ServiceTech">
        </div>

        <nav>
            <a href="../index.html">
                <img src="../img/inicio.png" alt=""> Início
            </a>
            <a href="../status-atendimento/status-atendimentos.html">
                <img src="../img/atendimento.png" alt=""> Meus Atendimentos
            </a>
            <a href="../index.html#servicos">
                <img src="../img/sobre.png" alt=""> Sobre Nós
            </a>
            <a href="../login/login.html">
                <img src="../img/login.png" alt=""> Login
            </a>
        </nav>
    </header>
    
        <!-- ÁREA PRINCIPAL COM MENU LATERAL E CONTEÚDO -->
        <div class="layout2">

            <!-- BARRA LATERAL DE NAVEGAÇÃO -->
            <aside class="barra-lateral">

                <!-- BOTÃO INÍCIO -->
                <a href="../index.html" class="item-lateral ativo" title="Início">
                    <i class="bi bi-house-door-fill"></i>
                </a>

                <!-- botao1
                <a href="#" class="item-lateral" title="Novo Atendimento">
                    <i class="bi bi-plus-circle"></i>
                </a>
                -->

                <!-- botao2
                <a href="../pagina6.html" class="item-lateral" title="Atendimentos">
                    <i class="bi bi-file-earmark-text"></i>
                </a>
                -->

                <!-- botao3
                <a href="#" class="item-lateral" title="Pesquisar">
                    <i class="bi bi-search"></i>
                </a>
                -->

                <!-- botao4
                <a href="#" class="item-lateral" title="Relatórios">
                    <i class="bi bi-bar-chart"></i>
                </a>
                -->

                <!-- botao5
                <a href="#" class="item-lateral" title="Configurações">
                    <i class="bi bi-gear"></i>
                </a>
                -->
            </aside>

            <!-- CONTEÚDO PRINCIPAL -->
            <main class="pai">

                <!-- CARTÃO PRINCIPAL DE ATENDIMENTOS -->
                <section class="card-central">

                    <!-- TÍTULO DA SEÇÃO -->
                    <div class="topo-secao">
                        <div class="icone-secao">
                            <i class="bi bi-wrench"></i>
                        </div>
                        <h1>Acompanhamento de Atendimentos</h1>
                    </div>

                    <!-- SELETORES DE FILTRO POR STATUS -->
                    <input type="radio" name="filtro" id="f-todos" checked>
                    <input type="radio" name="filtro" id="f-recebido">
                    <input type="radio" name="filtro" id="f-analise">
                    <input type="radio" name="filtro" id="f-manutencao">
                    <input type="radio" name="filtro" id="f-pronto">

                    <!-- BARRA DE FILTROS E PESQUISA -->
                    <div class="barra-controles">

                        <!-- BOTÕES DE FILTRO -->
                        <div class="filtros">
                            <label for="f-todos" class="filtro-btn">Todos</label>
                            <label for="f-recebido" class="filtro-btn">Recebido</label>
                            <label for="f-analise" class="filtro-btn">Em análise</label>
                            <label for="f-manutencao" class="filtro-btn">Em manutenção</label>
                            <label for="f-pronto" class="filtro-btn">Pronto</label>
                        </div>

                        <!-- CAMPO DE PESQUISA -->
                        <input type="search" class="pesquisa" aria-label="Pesquisar pelo nome do cliente" oninput="document.querySelectorAll('.tabela tbody tr').forEach(tr => tr.style.display = tr.children[1].textContent.toLowerCase().includes(this.value.toLowerCase()) ? '' : 'none')">
                    </div>

                    <!-- TABELA DE ATENDIMENTOS -->
                    <table class="tabela">

                        <!-- CABEÇALHO DA TABELA -->
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Serviço</th>
                                <th>Status</th>
                                <th>Data de criação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>

                        <!-- CORPO DA TABELA PREENCHIDO VIA JAVASCRIPT -->
                        <tbody id="lista-atendimentos"></tbody>

                    </table>

                </section>
            </main>
        </div>
    </div>

    <!-- CARREGAMENTO DOS DADOS VIA JAVASCRIPT -->
    <script>
        fetch('status-atendimento.json')
            .then(res => res.json())
            .then(dados => {
                document.getElementById('lista-atendimentos').innerHTML = dados.map(a => `
                    <tr class="item-${a.classe}">
                        <td>${a.id}</td>
                        <td>${a.cliente}</td>
                        <td>${a.aparelho}</td>
                        <td>${a.servico}</td>
                        <td class="${a.classe}">${a.status}</td>
                        <td>${a.data}</td>
                        <td>Editar | ...</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
